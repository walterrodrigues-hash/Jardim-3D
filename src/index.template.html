<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1022">
<script>try{var t=localStorage.getItem("jardim3d_theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<title>Jardim 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  /* Tema casa inteligente: marinho profundo, vidro fosco e acentos laranja, violeta, azul, rosa e verde. */
  color-scheme:dark;
  --bg:#0a1022; --surface:#121a33; --fg:#eef2ff; --muted:#9aa6cf; --line:var(--w12); --soft:var(--w07);
  --accent:#6cb6ff; --accent-fg:#ffffff;
  --c-orange:#ffb15c; --c-violet:#7a5cff; --c-blue:#6cb6ff; --c-pink:#ff72b0; --c-green:#3fdc86;
  --grad:linear-gradient(135deg,#3b8ef0 0%,#6d4cff 100%);
  --grad-soft:linear-gradient(135deg,rgba(108,182,255,.20),rgba(122,92,255,.20));
  --bgfx:radial-gradient(760px 420px at 0% -4%,rgba(60,120,220,.40) 0%,transparent 62%),radial-gradient(700px 420px at 100% 6%,rgba(122,92,255,.32) 0%,transparent 60%),radial-gradient(600px 500px at 50% 110%,rgba(255,114,176,.14) 0%,transparent 60%),#0a1022;
  --glass:linear-gradient(150deg,var(--w09),var(--w025));
  --good:#3fdc86; --bad:#ff6b7f; --warn:#ffb15c;
  --panel:rgba(18,26,51,.72); --pop:#121a33; --modal:#101731; --navbg:rgba(10,16,34,.88); --mixc:#fff;
  --st-orcamento:#8f7bff; --st-aprovado:#3fdc86; --st-producao:#ffb15c; --st-pronto:#6cb6ff; --st-entregue:#2dd4bf; --st-cancelado:#ff6b7f;
  --w025:rgba(255,255,255,.025);
  --w03:rgba(255,255,255,.03);
  --w04:rgba(255,255,255,.04);
  --w05:rgba(255,255,255,.05);
  --w06:rgba(255,255,255,.06);
  --w07:rgba(255,255,255,.07);
  --w08:rgba(255,255,255,.08);
  --w09:rgba(255,255,255,.09);
  --w1:rgba(255,255,255,.10);
  --w12:rgba(255,255,255,.12);
  --w14:rgba(255,255,255,.14);
  --w18:rgba(255,255,255,.18);
  --w22:rgba(255,255,255,.22);
  --w6:rgba(255,255,255,.6);
  --s1:#6cb6ff; --s2:#ffb15c; --grid:var(--w1); --axis:var(--w22); --ink2:#c9d1f0;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bgfx) fixed;color:var(--fg);font:14px/1.5 var(--body);margin:0;padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto}
header.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px 8px}
.brand{font:700 28px/1 var(--display);letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.brand small{display:block;font:400 12px var(--body);-webkit-text-fill-color:var(--muted);color:var(--muted);letter-spacing:0;margin-top:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
nav#nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
nav#nav a{padding:10px 14px;color:var(--muted);text-decoration:none;font:500 14px var(--display);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav#nav a[aria-current="page"]{color:var(--fg);background:var(--grad) bottom left/100% 3px no-repeat;font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font:600 17px/1.3 var(--display);margin:0 0 12px}
h3{font:600 14px/1.3 var(--display);margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 0 var(--w6) inset,0 6px 18px -10px rgba(109,40,217,.35)}
.stack{display:grid;gap:16px}
.cols2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.cols3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
button{font:500 13px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;cursor:pointer}
button{transition:transform .12s,box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(109,40,217,.5)}
button.primary{background:var(--grad);color:var(--accent-fg);border-color:transparent;font-weight:600}
button.danger{color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:5px 8px}
button.ghost:hover{color:var(--fg);background:var(--soft)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:14px var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.fg{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fg .w2{grid-column:span 2}.fg .wall{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--muted)} .sm{font-size:12px} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:500 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
select.stsel{font-weight:600;border-width:1px}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font:500 12px/18px var(--body);border:1px solid var(--line);white-space:nowrap}
.b-bad{color:var(--bad);border-color:var(--bad)} .b-warn{color:var(--warn);border-color:var(--warn)} .b-good{color:var(--good);border-color:var(--good)} .b-info{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;min-width:0;position:relative;overflow:hidden;box-shadow:0 6px 18px -12px rgba(109,40,217,.45)}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 25px var(--display);font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi details{margin-top:6px;font-size:12px;color:var(--muted)}
.kpi summary{cursor:pointer;color:var(--accent)}
.kpi.hl{background:var(--grad-soft);border-color:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font:11px var(--body)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.hb .bar{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.hb .bar b{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,var(--s1) 60%,#7c3aed);border-radius:0 4px 4px 0}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .val{font-variant-numeric:tabular-nums;color:var(--ink2)}
details.tv{margin-top:8px;font-size:12px}
details.tv summary{cursor:pointer;color:var(--accent)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;max-width:260px;display:none;white-space:pre-line}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.ov[hidden]{display:none}
.md{background:var(--grad) top left/100% 4px no-repeat,var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-top:4px;width:100%;max-width:640px;display:grid;grid-template-rows:auto 1fr auto;max-height:92vh}
.md.wide{max-width:1060px}
.md>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.md>header h2{margin:0}
.md .bd{padding:16px 18px;overflow:auto;min-width:0}
.md>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.fl{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.box p{margin:4px 0;max-width:75ch}
.note{background:var(--grad-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13px}
.warnbox{border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{height:64px;border-radius:6px;border:1px solid var(--line)}
.chip{border-radius:999px;padding:5px 12px}
.chip[aria-pressed="true"]{background:var(--grad);color:var(--accent-fg);border-color:transparent}
pre.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,monospace;max-height:50vh;overflow:auto}
@media (max-width:640px){.fg .w2{grid-column:1/-1}.fl{grid-template-columns:1fr 90px auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Tema vidro ---------- */
.brand{background:linear-gradient(120deg,#ffb15c,#ff72b0 45%,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
nav#nav{border-bottom:0;gap:6px;padding-bottom:4px}
nav#nav a{border-radius:999px;padding:8px 16px;margin-bottom:0;border:1px solid transparent}
nav#nav a:hover{background:var(--soft)}
nav#nav a[aria-current="page"]{background:linear-gradient(150deg,rgba(108,182,255,.28),rgba(122,92,255,.22));border-color:rgba(108,182,255,.55);color:#fff;box-shadow:0 0 18px -6px rgba(108,182,255,.7)}
.panel,.box,.item,.md{background:var(--glass),var(--panel);border:1px solid var(--w12);border-radius:20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.box,.item{border-radius:14px}
.md{background:var(--glass),var(--modal)}
button{background:var(--w06);border:1px solid var(--w14);border-radius:12px;color:var(--fg)}
button:hover:not(:disabled){background:var(--w12);box-shadow:0 6px 16px -8px rgba(108,182,255,.6)}
button.primary{background:var(--grad);border-color:var(--w18);color:#fff;box-shadow:0 8px 20px -10px rgba(122,92,255,.9)}
button.primary:hover:not(:disabled){background:var(--grad);filter:brightness(1.12)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--bad)}
input,select,textarea{background:var(--w05);border:1px solid var(--w14);border-radius:10px;color:var(--fg)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,182,255,.22);outline:0}
select option,select.stsel option{background:var(--pop);color:var(--fg)}
th{color:var(--muted);border-bottom:1px solid var(--w12)}
td{border-bottom:1px solid var(--w08)}
tbody tr:hover td{background:var(--w03)}
.kpi{--k:var(--c-blue);background:linear-gradient(150deg,color-mix(in srgb,var(--k) 24%,transparent),var(--w03) 70%),var(--panel);border:1px solid color-mix(in srgb,var(--k) 55%,transparent);border-radius:20px;box-shadow:0 12px 28px -18px var(--k);backdrop-filter:blur(10px)}
.kpi::before{display:none}
.kpi:nth-child(5n+1){--k:var(--c-orange)}
.kpi:nth-child(5n+2){--k:var(--c-violet)}
.kpi:nth-child(5n+3){--k:var(--c-blue)}
.kpi:nth-child(5n+4){--k:var(--c-pink)}
.kpi:nth-child(5n+5){--k:var(--c-green)}
.kpi .l,.kpi summary{color:color-mix(in srgb,var(--k) 70%,var(--mixc))}
.kpi.hl{background:linear-gradient(150deg,color-mix(in srgb,var(--k) 38%,transparent),var(--w04) 75%),var(--panel);border-color:var(--k)}
.hb .bar{background:var(--w08);border-radius:8px}
.hb .bar b{background:linear-gradient(90deg,#ffb15c,#ff72b0 55%,#7a5cff);border-radius:8px}
.note{background:var(--grad-soft);border:1px solid rgba(108,182,255,.45);border-radius:14px}
.warnbox{border-radius:14px;background:rgba(255,177,92,.08)}
.badge{border-radius:999px;background:var(--w05)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.ov{background:rgba(4,8,20,.66);backdrop-filter:blur(3px)}
.md>header{border-bottom:1px solid var(--w1)}
.md>footer{border-top:1px solid var(--w1)}
pre.out{background:var(--w06);border-color:var(--w12);border-radius:12px}
#tip{background:var(--fg);color:var(--bg)}
a{color:var(--accent)}

/* ---------- Cores por status (cada status tem a sua) ---------- */
select.stsel,select[data-d="status"]{--k:#9aa6cf;font-weight:600;border-radius:14px;padding-left:30px;color:color-mix(in srgb,var(--k) 55%,var(--mixc));
  background:radial-gradient(circle at 15px 50%,var(--k) 0 4.5px,transparent 5.5px),linear-gradient(150deg,color-mix(in srgb,var(--k) 34%,transparent),var(--w04) 80%);
  border:1px solid color-mix(in srgb,var(--k) 62%,transparent);box-shadow:0 8px 20px -14px var(--k)}
select[data-st="orcamento"]{--k:var(--st-orcamento)}
select[data-st="aprovado"]{--k:var(--st-aprovado)}
select[data-st="producao"]{--k:var(--st-producao)}
select[data-st="pronto"]{--k:var(--st-pronto)}
select[data-st="entregue"]{--k:var(--st-entregue)}
select[data-st="cancelado"]{--k:var(--st-cancelado)}
select.stsel option,select[data-d="status"] option{background:var(--pop);font-weight:600}
option[value="orcamento"]{color:var(--st-orcamento)}
option[value="aprovado"]{color:var(--st-aprovado)}
option[value="producao"]{color:var(--st-producao)}
option[value="pronto"]{color:var(--st-pronto)}
option[value="entregue"]{color:var(--st-entregue)}
option[value="cancelado"]{color:var(--st-cancelado)}
select.stsel[data-st="cancelado"]{text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- Seletor com busca ---------- */
.cb{position:relative}
.cb::after{content:"\25BE";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:13px}
.cb input{padding-right:30px;cursor:text}
.cb-list{position:fixed;z-index:200;background:var(--pop);border:1px solid var(--w18);border-radius:14px;box-shadow:0 18px 40px -12px #000;overflow:auto;padding:6px;overscroll-behavior:contain}
.cb-list div{padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--fg)}
.cb-list div.on{background:rgba(108,182,255,.22)}
.cb-list div.sel{font-weight:600}
.cb-list div.pin{color:var(--good);border-top:1px solid var(--w1);margin-top:4px;border-radius:0 0 9px 9px}
.cb-list .none{color:var(--muted);cursor:default}

/* ---------- Tema claro ---------- */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f5ff; --surface:#ffffff; --fg:#141a3a; --muted:#566090;
  --accent:#2f6fe0; --accent-fg:#ffffff;
  --c-orange:#f08c1a; --c-violet:#6d4cff; --c-blue:#2f80ed; --c-pink:#e0509a; --c-green:#16a34a;
  --grad-soft:linear-gradient(135deg,rgba(47,128,237,.14),rgba(109,76,255,.14));
  --bgfx:radial-gradient(760px 420px at 0% -4%,rgba(108,182,255,.38) 0%,transparent 62%),radial-gradient(700px 420px at 100% 6%,rgba(122,92,255,.20) 0%,transparent 60%),radial-gradient(600px 500px at 50% 110%,rgba(255,114,176,.14) 0%,transparent 60%),#f2f5ff;
  --glass:linear-gradient(150deg,rgba(255,255,255,.95),rgba(255,255,255,.6));
  --good:#12803f; --bad:#d6293e; --warn:#b45309;
  --panel:rgba(255,255,255,.72); --pop:#ffffff; --modal:#ffffff; --navbg:rgba(242,245,255,.92); --mixc:#10163a;
  --st-orcamento:#6d4cff; --st-aprovado:#16a34a; --st-producao:#d97706; --st-pronto:#2563eb; --st-entregue:#0d9488; --st-cancelado:#dc2626;
  --s1:#2f80ed; --s2:#e8890c; --ink2:#3a4270;
  --w025:rgba(22,30,72,.025);
  --w03:rgba(22,30,72,.03);
  --w04:rgba(22,30,72,.04);
  --w05:rgba(22,30,72,.05);
  --w06:rgba(22,30,72,.06);
  --w07:rgba(22,30,72,.07);
  --w08:rgba(22,30,72,.08);
  --w09:rgba(22,30,72,.09);
  --w1:rgba(22,30,72,.10);
  --w12:rgba(22,30,72,.12);
  --w14:rgba(22,30,72,.14);
  --w18:rgba(22,30,72,.18);
  --w22:rgba(22,30,72,.22);
  --w6:rgba(255,255,255,.6);
}
:root[data-theme="light"] .brand,:root[data-theme="light"] #lgTitle{background:linear-gradient(120deg,#e8590c,#d6336c 45%,#6d4cff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .panel,:root[data-theme="light"] .box,:root[data-theme="light"] .item,:root[data-theme="light"] .md,:root[data-theme="light"] .kpi{box-shadow:0 12px 28px -20px rgba(40,50,120,.55)}
:root[data-theme="light"] nav#nav a[aria-current="page"]{color:#0f1a44;background:linear-gradient(150deg,rgba(47,128,237,.22),rgba(109,76,255,.16));border-color:rgba(47,128,237,.5);box-shadow:0 0 16px -8px rgba(47,128,237,.7)}
:root[data-theme="light"] button.primary{color:#fff}
:root[data-theme="light"] .ov{background:rgba(30,40,90,.38)}
:root[data-theme="light"] .hb .bar b{background:linear-gradient(90deg,#f59e0b,#e0509a 55%,#6d4cff)}
:root[data-theme="light"] .cb-list{box-shadow:0 18px 40px -14px rgba(40,50,120,.45)}

/* ---------- Mobile ---------- */
.panel:has(>svg.ch){overflow-x:auto}
@media (max-width:760px){
  body{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
  header.top{padding-block:12px 8px;gap:10px}
  .brand{font-size:24px}
  .quick{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quick .primary{grid-column:1/-1}
  .quick button{min-height:44px;padding-inline:8px}
  nav#nav{position:sticky;top:0;z-index:20;margin-inline:-12px;padding-inline:8px;background:var(--navbg);backdrop-filter:blur(10px);box-shadow:0 8px 16px -14px #000;scrollbar-width:none}
  nav#nav::-webkit-scrollbar{display:none}
  nav#nav a{padding:13px 12px}
  button{min-height:42px;padding:9px 14px}
  button.ghost{min-height:38px}
  input,select,textarea{font-size:16px;min-height:42px;padding:9px 10px}
  textarea{min-height:80px}
  h2{font-size:16px}
  .panel{padding:12px;border-radius:12px}
  .stack,.cols2,.cols3{gap:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px 10px 10px}
  .kpi .v{font-size:19px}
  .kpi .l{font-size:10px}
  .row>label[style],.row label[style*="width"]{width:100%!important;max-width:none!important}
  .row{gap:8px}
  .fg{grid-template-columns:1fr 1fr;gap:10px}
  .fg .w2,.fg .wall{grid-column:1/-1}
  .fl{grid-template-columns:1fr 90px auto}

<script id="core">
/* ===== Núcleo de cálculo (sem DOM) ===== */
const COUNT=["aprovado","producao","pronto","entregue"];
const STAT=[["orcamento","Orçamento"],["aprovado","Aprovado"],["producao","Em produção"],["pronto","Pronto"],["entregue","Entregue"],["cancelado","Cancelado"]];
const DEF_CFG={kwh:0.95,horaTrab:20,taxa:5,imposto:0,margem:40,modo:"margem",perda:5};
const n0=v=>{const n=typeof v==="number"?v:parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:0};

// custo de UMA unidade do item. real = {filReal (R$ total do pedido p/ este item), horasReal}
function itemCost(it,c,real,qtd){
  const imp=(c.imps&&c.imps[it.imp])||{watts:0,custoHora:0};
  const h=real&&real.horasReal!=null&&real.horasReal!==""?n0(real.horasReal):n0(it.horas);
  const filPlan=(it.fil||[]).reduce((s,l)=>s+n0(l.g)*(((c.fils&&c.fils[l.id])||{}).custoMedio||0),0);
  const fil=real&&real.filReal!=null?real.filReal/Math.max(1,qtd):filPlan;
  const energia=h*n0(imp.watts)/1000*c.cfg.kwh;
  const maq=h*n0(imp.custoHora);
  const mao=n0(it.min)/60*c.cfg.horaTrab;
  const extras=n0(it.emb)+n0(it.acab)+n0(it.outros);
  const base=(real&&real.filReal!=null?0:fil)+energia+maq;   // com consumo real, falhas de filamento já estão no real
  const perdas=base*n0(it.perdaPct)/100;
  return {fil,energia,maq,mao,extras,perdas,total:fil+energia+maq+mao+extras+perdas};
}
function orderCalc(p,c){
  const itens=(p.itens||[]).map((it,idx)=>{
    const q=Math.max(0,n0(it.qtd)),pr=p.producao&&p.producao.itens&&p.producao.itens[idx];
    const real=pr?{filReal:pr.filReal,horasReal:pr.horasReal}:null;
    const cu=itemCost(it,c,real,q);
    return {desc:it.desc,qtd:q,preco:n0(it.preco),receita:q*n0(it.preco),cu,custo:cu.total*q,real:!!pr,
      semFil:!(it.fil&&it.fil.length)&&!pr,parts:{fil:cu.fil*q,energia:cu.energia*q,maq:cu.maq*q,mao:cu.mao*q,extras:cu.extras*q,perdas:cu.perdas*q}};
  });
  const subtotal=itens.reduce((s,i)=>s+i.receita,0),desconto=n0(p.desconto),frete=n0(p.frete);
  const total=subtotal-desconto+frete,pago=(p.pagamentos||[]).reduce((s,x)=>s+n0(x.valor),0);
  const taxas=total*(c.cfg.taxa+c.cfg.imposto)/100;
  const parts={fil:0,energia:0,maq:0,mao:0,extras:0,perdas:0,taxas};
  itens.forEach(i=>Object.keys(i.parts).forEach(k=>parts[k]+=i.parts[k]));
  const custoProd=parts.fil+parts.energia+parts.maq+parts.mao+parts.extras+parts.perdas+taxas;
  const lucro=total-custoProd;
  return {itens,subtotal,desconto,frete,total,pago,saldo:total-pago,taxas,custoProd,lucro,margem:total?lucro/total:0,apurado:!!p.producao,parts,
    faltaCusto:itens.some(i=>i.semFil)};
}
// preço sugerido: C = custo unitário SEM taxas; f = % de taxas sobre a venda; v = % desejada
function precoSugerido(C,f,modo,v){
  const fr=f/100;
  if(modo==="margem"){const d=1-fr-v/100;return d>0?C/d:NaN}
  return (1-fr)>0?C*(1+v/100)/(1-fr):NaN;
}
function lucroLiquido(preco,C,f){return preco*(1-f/100)-C}
// custo médio ponderado
function wacCompra(estoque,custoMedio,g,valor){
  const est=Math.max(0,estoque||0),n=est+g;
  return {estoque:(estoque||0)+g,custoMedio:n>0?(est*(custoMedio||0)+valor)/n:0};
}
/* ===== fim do núcleo ===== */
</script>

<script id="supabase-shim">
/* Camada de dados Supabase: oferece ao app a mesma interface do banco do Artifact. */
(function(){
const SB_URL="__SUPABASE_URL__";
const SB_KEY="__SUPABASE_KEY__"; // chave publicável: segura no navegador, protegida pelo RLS
const TBL="jardim_docs",SK="jardim3d_session",POLL=6000;
let session=null;try{session=JSON.parse(localStorage.getItem(SK)||"null")}catch(_){}
const saveSess=s=>{session=s;try{s?localStorage.setItem(SK,JSON.stringify(s)):localStorage.removeItem(SK)}catch(_){}};
async function auth(grant,body){
  const r=await fetch(SB_URL+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Falha no login");
  saveSess({access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,email:(j.user||{}).email});
}
async function token(){
  if(!session)throw new Error("sem sessão");
  if(Date.now()>session.exp){try{await auth("refresh_token",{refresh_token:session.refresh_token})}catch(e){saveSess(null);location.reload();throw e}}
  return session.access_token;
}
async function api(path,opt){
  const t=await token();
  const r=await fetch(SB_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SB_KEY,Authorization:"Bearer "+t,"Content-Type":"application/json",...(opt&&opt.headers)}});
  if(!r.ok){const x=await r.text();throw new Error("Supabase "+r.status+": "+x)}
  return r.status===204?null:r.json().catch(()=>null);
}
function loginUI(){
  return new Promise(res=>{
    const d=document.createElement("div");
    d.style.cssText="position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(700px 400px at 10% 5%,rgba(60,120,220,.5) 0%,transparent 60%),radial-gradient(700px 400px at 95% 95%,rgba(255,114,176,.30) 0%,transparent 60%),#0a1022;font-family:system-ui,sans-serif";
    d.innerHTML=`<form style="background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),#121a33;color:#eef2ff;border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:28px;width:min(360px,92vw);display:grid;gap:12px;box-shadow:0 20px 50px -20px #000">
      <h2 style="margin:0;background:linear-gradient(120deg,#ffb15c,#ff72b0 45%,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content">Jardim 3D</h2><p style="margin:0;color:#9aa6cf;font-size:14px">Entre para acessar seus dados.</p>
      <label style="display:grid;gap:4px;font-size:13px;color:#9aa6cf">E-mail<input name="e" type="email" required autocomplete="username" style="padding:9px;border:1px solid rgba(255,255,255,.18);border-radius:12px;font-size:16px;background:rgba(255,255,255,.06);color:#eef2ff;width:100%;box-sizing:border-box"></label>
      <label style="display:grid;gap:4px;font-size:13px;color:#9aa6cf">Senha<input name="p" type="password" required autocomplete="current-password" style="padding:9px;border:1px solid rgba(255,255,255,.18);border-radius:12px;font-size:16px;background:rgba(255,255,255,.06);color:#eef2ff;width:100%;box-sizing:border-box"></label>
      <div class="err" style="color:#ff6b7f;font-size:13px;min-height:16px"></div>
      <button style="padding:10px;border:0;border-radius:8px;background:linear-gradient(135deg,#3b8ef0,#6d4cff);color:#fff;font-size:15px;font-weight:600;cursor:pointer">Entrar</button></form>`;
    document.body.appendChild(d);
    d.querySelector("form").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,er=d.querySelector(".err");er.textContent="";
      try{await auth("password",{email:f.querySelector("[name=e]").value.trim(),password:f.querySelector("[name=p]").value});d.remove();res()}catch(e){er.textContent=e.message==="Invalid login credentials"?"E-mail ou senha incorretos.":e.message}};
  });
}
async function ensureLogin(){if(!session){if(document.body)await loginUI();else await new Promise(r=>addEventListener("DOMContentLoaded",()=>loginUI().then(r)))}}
const sig={};
async function fetchCol(col){return (await api(TBL+"?col=eq."+encodeURIComponent(col)+"&select=id,data"))||[]}
const watchers={};
function collection(col){return{onSnapshot(cb,errCb){
  const run=async()=>{try{const rows=await fetchCol(col),s=JSON.stringify(rows);
    if(s!==sig[col]){sig[col]=s;cb({docs:rows.map(r=>({id:r.id,data:()=>r.data||{}}))})}}catch(e){errCb&&errCb(e)}};
  watchers[col]=run;run();setInterval(()=>{if(!document.hidden)run()},POLL);
}}}
function parse(p){const i=p.indexOf("/");return[p.slice(0,i),p.slice(i+1)]}
function doc(path){const[col,id]=parse(path);return{
  async set(data){await api(TBL+"?on_conflict=col,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({col,id,data,updated_at:new Date().toISOString()})});watchers[col]&&watchers[col]()},
  async delete(){await api(TBL+"?col=eq."+encodeURIComponent(col)+"&id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}});watchers[col]&&watchers[col]()}
}}
const dbNs={collection,doc,logout(){saveSess(null);location.reload()}};
const dlNs={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
window.claude={use:async n=>{if(n==="db"){await ensureLogin();return dbNs}if(n==="downloads")return dlNs;return null}};
window.jardimLogout=()=>dbNs.logout();
})();
</script>

<script id="app">
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>isFinite(n)?n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):"—";
const nf=(n,d=1)=>(isFinite(n)?n:0).toLocaleString("pt-BR",{maximumFractionDigits:d});
const pct=n=>nf(n*100,1)+"%";
const gfmt=g=>Math.abs(g)>=1000?nf(g/1000,2)+" kg":nf(g,0)+" g";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>isoD(new Date());
const addDays=(iso,n)=>{const [y,m,d]=iso.split("-").map(Number);return isoD(new Date(y,m-1,d+n))};
const fmtD=s=>s?s.split("-").reverse().join("/"):"—";
const daysTo=iso=>{if(!iso)return null;const [y,m,d]=iso.split("-").map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)};
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const ymLabel=ym=>MES[+ym.slice(5,7)-1]+"/"+ym.slice(2,4);
const statLabel=k=>(STAT.find(s=>s[0]===k)||[0,k])[1];

/* ---------- dados ---------- */
const COLS=["clientes","pedidos","filamentos","movimentos","impressoras","lancamentos","config"];
const D={};COLS.forEach(c=>D[c]=[]);
let dbc=null,loadedN=0,ready=false;
const LS="jardim3d_";
function saveLocal(col){try{localStorage.setItem(LS+col,JSON.stringify(D[col]))}catch(_){}}
async function put(col,obj){
  if(!obj.id)obj.id=uid();
  const copy=JSON.parse(JSON.stringify(obj));
  if(dbc){const {id,...rest}=copy;await dbc.doc(col+"/"+id).set(rest)}
  const i=D[col].findIndex(x=>x.id===obj.id);
  if(!dbc){if(i>=0)D[col][i]=copy;else D[col].push(copy);saveLocal(col)}
  else{if(i>=0)D[col][i]=copy;else D[col].push(copy)}   // otimista; o snapshot confirma
  return obj;
}
async function del(col,id){
  if(dbc)await dbc.doc(col+"/"+id).delete();
  D[col]=D[col].filter(x=>x.id!==id);if(!dbc)saveLocal(col);
}
async function initStore(){
  try{dbc=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(_){dbc=null}
  if(dbc){
    const t=setTimeout(()=>{if(!ready)banner()},10000);
    COLS.forEach(col=>dbc.collection(col).onSnapshot(snap=>{
      D[col]=snap.docs.map(d=>({...d.data(),id:d.id}));loadedN++;
      if(loadedN>=COLS.length){ready=true;clearTimeout(t)}
      renderSoft();
    },e=>{console.error(col,e)}));
  }else{
    COLS.forEach(col=>{try{D[col]=JSON.parse(localStorage.getItem(LS+col)||"[]")}catch(_){D[col]=[]}});
    ready=true;renderAll();
  }
}
const byId=col=>Object.fromEntries(D[col].map(x=>[x.id,x]));
function cfg(){const c=D.config.find(x=>x.id==="main")||{};return {...DEF_CFG,...c}}
function ctx(){return {fils:byId("filamentos"),imps:byId("impressoras"),cfg:cfg()}}
const cli=id=>(D.clientes.find(c=>c.id===id)||{nome:"(sem cliente)"});
const filName=f=>f?[f.marca,f.material,f.cor].filter(Boolean).join(" "):"(removido)";

/* ---------- período ---------- */
let P={preset:"ano",from:"",to:""};
function periodRange(){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(P.preset==="mes")return [isoD(new Date(y,m,1)),isoD(new Date(y,m+1,0))];
  if(P.preset==="mespass")return [isoD(new Date(y,m-1,1)),isoD(new Date(y,m,0))];
  if(P.preset==="3m")return [isoD(new Date(y,m-2,1)),isoD(new Date(y,m+1,0))];
  if(P.preset==="ano")return [y+"-01-01",y+"-12-31"];
  if(P.preset==="custom"&&P.from&&P.to)return [P.from,P.to];
  return ["0000-01-01","9999-12-31"];
}
const inR=(d,a,b)=>!!d&&d>=a&&d<=b;
function periodCtl(){
  const o=[["mes","Este mês"],["mespass","Mês passado"],["3m","Últimos 3 meses"],["ano","Este ano"],["tudo","Tudo"],["custom","Personalizado"]];
  return `<div class="row"><label style="min-width:170px">Período<select data-pf="preset">${o.map(([k,l])=>`<option value="${k}"${P.preset===k?" selected":""}>${l}</option>`).join("")}</select></label>
  ${P.preset==="custom"?`<label>De<input type="date" data-pf="from" value="${P.from}"></label><label>Até<input type="date" data-pf="to" value="${P.to}"></label>`:""}</div>`;
}

/* ---------- agregações ---------- */
const CAT_LABELS=[["fil","Filamento"],["energia","Energia"],["maq","Máquina (manutenção/depreciação)"],["mao","Mão de obra"],["extras","Embalagem, acabamento e outros"],["perdas","Perdas de impressão"],["taxas","Taxas e impostos"],["desp","Despesas do negócio"]];
function agg(from,to){
  const c=ctx(),peds=D.pedidos.filter(p=>COUNT.includes(p.status)&&inR(p.data,from,to));
  const r={vendido:0,cpv:0,parts:{fil:0,energia:0,maq:0,mao:0,extras:0,perdas:0,taxas:0},qtd:peds.length,apurados:0,estimados:0,faltaCusto:0,prod:{},peds};
  peds.forEach(p=>{const o=orderCalc(p,c);r.vendido+=o.total;r.cpv+=o.custoProd;
    Object.keys(o.parts).forEach(k=>r.parts[k]+=o.parts[k]);
    if(o.apurado)r.apurados++;else r.estimados++;if(o.faltaCusto)r.faltaCusto++;
    o.itens.forEach(i=>{const k=i.desc||"(sem descrição)";r.prod[k]=r.prod[k]||{qtd:0,receita:0};r.prod[k].qtd+=i.qtd;r.prod[k].receita+=i.receita})});
  r.recebido=0;D.pedidos.filter(p=>p.status!=="cancelado").forEach(p=>(p.pagamentos||[]).forEach(x=>{if(inR(x.data,from,to))r.recebido+=n0(x.valor)}));
  r.saldoReceber=0;D.pedidos.filter(p=>COUNT.includes(p.status)).forEach(p=>{const s=orderCalc(p,c).saldo;if(s>0.005)r.saldoReceber+=s});
  r.despManual=D.lancamentos.filter(l=>l.tipo==="despesa"&&!l.incluida&&inR(l.data,from,to)).reduce((s,l)=>s+n0(l.valor),0);
  r.perdasEstoque=D.movimentos.filter(m=>(m.tipo==="perda"||(m.tipo==="consumo"&&!m.pedidoId))&&inR(m.data,from,to)).reduce((s,m)=>s+n0(m.valor),0);
  r.desp=r.despManual+r.perdasEstoque;
  r.outrasRec=D.lancamentos.filter(l=>l.tipo==="receita"&&inR(l.data,from,to)).reduce((s,l)=>s+n0(l.valor),0);
  r.lucro=r.vendido-r.cpv-r.desp+r.outrasRec;
  r.margem=r.vendido?r.lucro/r.vendido:0;
  r.ticket=r.qtd?r.vendido/r.qtd:0;
  r.consumo=D.movimentos.filter(m=>(m.tipo==="consumo"||m.tipo==="perda")&&inR(m.data,from,to)).reduce((s,m)=>s+n0(m.gramas),0);
  return r;
}
function monthsOf(from,to){
  let a=from<"1000"?null:from.slice(0,7),b=to>"9000"?today().slice(0,7):to.slice(0,7);
  if(!a){const ds=[...D.pedidos.map(p=>p.data),...D.movimentos.map(m=>m.data)].filter(Boolean).sort();a=ds.length?ds[0].slice(0,7):b}
  const out=[];let [y,m]=a.split("-").map(Number);const [y2,m2]=b.split("-").map(Number);
  while((y<y2||(y===y2&&m<=m2))&&out.length<60){out.push(y+"-"+String(m).padStart(2,"0"));m++;if(m>12){m=1;y++}}
  return out.slice(-12);
}
function cashEntries(from,to){
  const out=[];
  D.pedidos.filter(p=>p.status!=="cancelado").forEach(p=>(p.pagamentos||[]).forEach(x=>{if(inR(x.data,from,to))out.push({data:x.data,dir:"in",origem:"Pedido #"+p.numero,cat:"Vendas",desc:(x.tipo==="sinal"?"Sinal":"Pagamento")+" · "+cli(p.clienteId).nome,valor:n0(x.valor)})}));

/* ---------- gráficos ---------- */
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function colChart(labels,series){
  const W=640,H=250,L=62,R=8,T=12,B=28;
  const all=series.flatMap(s=>s.vals);let mx=Math.max(0,...all),mn=Math.min(0,...all);
  const step=niceStep((mx-mn||1)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1));
  let g="";for(let t=mn;t<=mx+1e-9;t+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${nf(t,0)}</text>`}
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  const gw=(W-L-R)/labels.length,bw=Math.min(26,(gw-10)/series.length-2);
  labels.forEach((lb,i)=>{
    const cx=L+gw*i+gw/2,tip=ymLabel(lb)+"\n"+series.map(s=>s.name+": "+brl(s.vals[i])).join("\n");
    series.forEach((s,k)=>{const v=s.vals[i],x=cx-(series.length*(bw+2)-2)/2+k*(bw+2),y1=y(Math.max(v,0)),h=Math.max(1,Math.abs(y(v)-y(0)));
      g+=`<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="3" fill="${s.color}"/>`});
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${ymLabel(lb)}</text><rect x="${L+gw*i}" y="${T}" width="${gw}" height="${H-T-B}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de colunas por mês">${g}</svg>`;
}
function lineChart(labels,vals,color,fmt){
  const W=640,H=220,L=62,R=14,T=12,B=28;
  let mx=Math.max(1,...vals);const step=niceStep(mx/4);mx=Math.ceil(mx/step)*step;
  const x=i=>L+(labels.length>1?(W-L-R)*i/(labels.length-1):(W-L-R)/2),y=v=>T+(H-T-B)*(1-v/mx);
  let g="";for(let t=0;t<=mx+1e-9;t+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${nf(t,0)}</text>`;
  g+=`<path d="${vals.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join("")}" fill="none" stroke="${color}" stroke-width="2"/>`;
  vals.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/><text x="${x(i)}" y="${H-8}" text-anchor="middle">${ymLabel(labels[i])}</text><circle cx="${x(i)}" cy="${y(v)}" r="14" fill="transparent" data-tip="${esc(ymLabel(labels[i])+"\n"+fmt(v))}"/>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linha por mês">${g}</svg>`;
}
function hbars(rows,fmt){
  if(!rows.length)return '<div class="empty">Sem dados no período.</div>';
  const mx=Math.max(...rows.map(r=>r.v))||1;
  return `<div class="hb">`+rows.map(r=>`<span class="lab" title="${esc(r.l)}">${esc(r.l)}</span><span class="bar"><b style="width:${Math.max(2,r.v/mx*100)}%" data-tip="${esc(r.l+"\n"+fmt(r.v))}"></b></span><span class="val">${fmt(r.v)}</span>`).join("")+`</div>`;
}
function tblDetails(head,rows){

async function saveFile(filename,data,mime){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(_){}
  if(dl){try{await dl.save({filename,data:data instanceof Blob||data instanceof Uint8Array?data:new Blob([data],{type:mime})});return}catch(e){if(e&&e.code==="cancelled")return}}
  const txt=typeof data==="string"?data:null;
  openModal("Copiar conteúdo",`<p class="mut">O download direto não está disponível aqui.${txt?" Copie o texto abaixo e cole em um arquivo "+esc(filename)+".":""}</p>${txt?`<textarea id="cp" style="min-height:260px;font:12px ui-monospace,monospace">${esc(txt)}</textarea>`:""}`,
    [{label:"Copiar",primary:true,fn:async()=>{try{await navigator.clipboard.writeText(txt)}catch(_){const t=$("#cp");t.select()}return true}},{label:"Fechar",fn:()=>{}}]);
}
function csv(headers,rows){

/* ---------- PDF simples (texto) ---------- */
function makePDF(lines){
  const L1=s=>String(s).replace(/[^\x20-\xFF]/g,"?").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
  const pages=[];let cur=[],y=800;
  lines.forEach(ln=>{const sz=ln.s||10,lh=sz+5;if(y-lh<50){pages.push(cur);cur=[];y=800}
    cur.push(`BT /${ln.b?"F2":"F1"} ${sz} Tf 50 ${y} Td (${L1(ln.t)}) Tj ET`);y-=lh});
  pages.push(cur);
  const objs=[];const add=s=>{objs.push(s);return objs.length};
  add("<< /Type /Catalog /Pages 2 0 R >>");
  const kids=pages.map((_,i)=>`${5+i*2} 0 R`).join(" ");
  add(`<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`);
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  pages.forEach((pg,i)=>{
    add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+i*2} 0 R >>`);
    const s=pg.join("\n");add(`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);
  });
  let out="%PDF-1.4\n";const off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
}

function setPath(o,path,val){const ks=path.split(".");let t=o;for(let i=0;i<ks.length-1;i++)t=t[ks[i]];t[ks[ks.length-1]]=val}
function toThumb(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("imagem inválida"))};im.src=u})}
function liveCalc(){
  const c=ctx(),o=orderCalc({...draft,producao:draftEdit&&draftEdit.producao,pagamentos:draftEdit?draftEdit.pagamentos:[]},c),f=(c.cfg.taxa+c.cfg.imposto);
  o.itens.forEach((it,i)=>{const el=$("#calc"+i);if(!el)return;
    const cu=it.cu,sug=precoSugerido(cu.total,f,c.cfg.modo,c.cfg.modo==="margem"?c.cfg.margem:c.cfg.margem),preco=it.preco,lu=lucroLiquido(preco,cu.total,f);
    el.innerHTML=`<span>Custo unitário: <strong>${brl(cu.total)}</strong>${it.real?' <span class="badge b-good">consumo real</span>':""}</span>
      <span class="mut">·</span><span>Sugerido (${c.cfg.modo==="margem"?"margem":"acréscimo"} de ${nf(c.cfg.margem,1)}%): <strong>${brl(sug)}</strong></span>
      <button class="ghost" data-act="d-use-sug" data-i="${i}" data-v="${isFinite(sug)?Math.round(sug*100)/100:""}">Usar sugerido</button>
      <span class="mut">·</span><span>Lucro por unidade: <strong class="${lu>=0?"good":"bad"}">${brl(lu)}</strong> (${preco?pct(lu/preco):"—"})</span>
      <div class="mut sm" style="width:100%">Filamento ${brl(cu.fil)} · energia ${brl(cu.energia)} · máquina ${brl(cu.maq)} · mão de obra ${brl(cu.mao)} · extras ${brl(cu.extras)} · perdas ${brl(cu.perdas)} (taxas de ${nf(f,1)}% entram sobre a venda)</div>`});
  $("#ptotals").innerHTML=`<div class="row" style="gap:18px">
    <span>Subtotal <strong>${brl(o.subtotal)}</strong></span><span>Desconto <strong>${brl(o.desconto)}</strong></span><span>Frete <strong>${brl(o.frete)}</strong></span>
    <span>Total <strong style="font-size:16px">${brl(o.total)}</strong></span><span>Pago <strong>${brl(o.pago+(n0(draft._sinal)))}</strong></span><span>Saldo <strong>${brl(o.total-o.pago-n0(draft._sinal))}</strong></span>
    <span>Custo <strong>${brl(o.custoProd)}</strong></span><span>Lucro ${o.apurado?"apurado":"estimado"} <strong class="${o.lucro>=0?"good":"bad"}">${brl(o.lucro)} (${pct(o.margem)})</strong></span></div>`;
}
async function savePedido(){
  const d=draft;
  if(!d.clienteId)throw new Error("Escolha o cliente.");
  d.itens=d.itens.filter(i=>(i.desc||"").trim()||n0(i.preco));
  if(!d.itens.length)throw new Error("Adicione ao menos um produto com descrição.");
  if(draftEdit&&draftEdit.producao&&d.itens.length!==draftEdit.itens.length)throw new Error("Este pedido já tem consumo registrado: não dá para remover produtos. Ajuste as quantidades ou cancele o pedido.");
  for(const i of d.itens){if(!(i.desc||"").trim())throw new Error("Todo produto precisa de descrição.");if(n0(i.qtd)<1)throw new Error("A quantidade deve ser 1 ou mais.");if(!(n0(i.preco)>=0))throw new Error("Preço inválido.")}
  if(!d.data)throw new Error("Informe a data do pedido.");
  if(d.prazo&&d.prazo<d.data)throw new Error("O prazo de entrega não pode ser antes da data do pedido.");
  if(d.clienteId==="__new"){
    const nome=($("[name=ncNome]")||{}).value.trim();if(!nome)throw new Error("Informe o nome do novo cliente.");
    const c=await put("clientes",{nome,tel:($("[name=ncTel]")||{}).value.trim(),obs:""});d.clienteId=c.id;
  }
  d.itens.forEach(i=>{i.qtd=n0(i.qtd);i.fil=i.fil.filter(l=>l.id&&n0(l.g)>0).map(l=>({id:l.id,g:n0(l.g)}))});
  const tot=orderCalc(d,ctx()).total;
  if(tot<0)throw new Error("O desconto é maior que o valor dos produtos.");
  const sinal=n0(d._sinal);delete d._sinal;delete d._ncNome;delete d._ncTel;
  if(!draftEdit&&sinal>0){if(sinal>tot+0.005)throw new Error("O sinal é maior que o total do pedido.");d.pagamentos=[{id:uid(),data:today(),valor:sinal,forma:"Pix",tipo:"sinal"}]}
  d.desconto=n0(d.desconto);d.frete=n0(d.frete);
  if(JSON.stringify(d).length>240000){d.fotos=[]}
  await put("pedidos",d);renderAll();
}

/* ---- produção e consumo ---- */
function producaoModal(id){
  const p=D.pedidos.find(x=>x.id===id);if(!p)return;
  if(p.producao){openModal("Produção já registrada","<p>O consumo deste pedido já foi descontado do estoque. Para corrigir diferenças, use um ajuste ou uma perda na tela de Filamentos.</p>",[{label:"Fechar",fn:()=>{}}]);return}
  const fl=byId("filamentos");
  const body=(p.itens||[]).map((it,i)=>`<div class="item" style="margin-bottom:10px"><strong>${n0(it.qtd)}× ${esc(it.desc)}</strong>
    ${(it.fil||[]).length?it.fil.map((l,k)=>{const prev=n0(l.g)*n0(it.qtd);return `<div class="fl"><label>${esc(filName(fl[l.id]))}<span class="mut sm">Previsto: ${nf(prev,1)} g · estoque ${gfmt((fl[l.id]||{}).estoque||0)}</span><input type="number" min="0" step="any" name="g_${i}_${k}" value="${prev}"></label><span></span><span></span></div>`}).join(""):'<p class="warn sm">Este produto não tem filamento na ficha de custo. Edite o pedido para informar o consumo.</p>'}
    <label style="max-width:240px">Horas reais de impressão (por unidade, opcional)<input type="number" min="0" step="any" name="h_${i}" placeholder="${esc(it.horas||"")}"></label></div>`).join("");
  openModal("Registrar produção e consumo — pedido #"+p.numero,`<p class="mut">Informe o consumo <strong>real</strong> de cada filamento, incluindo suportes, purga e peças que falharam. O estoque é descontado ao custo médio de hoje, e esse custo fica gravado neste pedido.</p>${body}`,[
    {label:"Cancelar",fn:()=>{}},
    {label:"Confirmar produção",primary:true,fn:async()=>{
      const v=formVals($("#mdb")),fm=byId("filamentos"),itens={},movs=[],upd={};
      (p.itens||[]).forEach((it,i)=>{let filReal=0,gReal=0,gPrev=0;
        (it.fil||[]).forEach((l,k)=>{const g=n0(v[`g_${i}_${k}`]);if(g<0)throw new Error("Consumo não pode ser negativo.");
          const f=upd[l.id]||{...(fm[l.id]||{})};if(!f.id)throw new Error("Um filamento da ficha foi removido do cadastro.");
          const custo=g*(f.custoMedio||0);filReal+=custo;gReal+=g;gPrev+=n0(l.g)*n0(it.qtd);
          f.estoque=(f.estoque||0)-g;upd[l.id]=f;
          if(g>0)movs.push({filId:l.id,tipo:"consumo",gramas:g,valor:custo,data:today(),pedidoId:p.id,obs:"Pedido #"+p.numero+" · "+it.desc,demo:p.demo||undefined})});
        itens[i]={filReal,gramasReal:gReal,gramasPrev:gPrev,horasReal:v["h_"+i]===""?null:n0(v["h_"+i])}});
      for(const k of Object.keys(upd))await put("filamentos",upd[k]);
      for(const m of movs)await put("movimentos",m);
      await put("pedidos",{...p,producao:{data:today(),itens},status:["aprovado","producao"].includes(p.status)?"pronto":p.status});
      renderAll();return false}}
  ],true);
}

function calcUpdate(){
  const root=$("#cc");if(!root)return;const v=formVals(root),c=ctx(),imp=c.imps[v.imp]||{watts:0,custoHora:0};
  const fil=n0(v.g)*n0(v.rkg)/1000,en=n0(v.h)*n0(imp.watts)/1000*c.cfg.kwh,mq=n0(v.h)*n0(imp.custoHora),mao=n0(v.min)/60*c.cfg.horaTrab,ext=n0(v.ext),per=(fil+en+mq)*n0(v.perda)/100;
  const C=fil+en+mq+mao+ext+per,f=n0(v.taxas);
  const pm=precoSugerido(C,f,"margem",n0(v.mg)),pk=precoSugerido(C,f,"acrescimo",n0(v.mk));
  const lm=lucroLiquido(pm,C,f),lk=lucroLiquido(pk,C,f);
  $("#cout").innerHTML=`<div class="box"><h3>Custo unitário: ${brl(C)}</h3><p class="mut sm">Filamento ${brl(fil)} · energia ${brl(en)} · máquina ${brl(mq)} · mão de obra ${brl(mao)} · extras ${brl(ext)} · perdas ${brl(per)}</p></div>
   <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div class="kpi hl"><div class="l">Pela margem de ${nf(n0(v.mg),1)}% sobre a venda</div><div class="v">${brl(pm)}</div><div class="s">Lucro líquido ${brl(lm)} (${pm?pct(lm/pm):"—"} da venda)</div></div>
   <div class="kpi hl"><div class="l">Pelo acréscimo de ${nf(n0(v.mk),1)}% sobre o custo</div><div class="v">${brl(pk)}</div><div class="s">Lucro líquido ${brl(lk)} (${pk?pct(lk/pk):"—"} da venda)</div></div></div>
   <div class="box"><h3>Margem ou acréscimo? Qual a diferença</h3>
    <p><strong>Acréscimo sobre o custo</strong> (markup): você soma uma porcentagem ao custo. Custo R$ 10 com acréscimo de 100% vira R$ 20.</p>
    <p><strong>Margem sobre a venda</strong>: é quanto do preço final vira lucro. Se vendeu por R$ 20 e o lucro foi R$ 10, a margem é 50%.</p>
    <p>Por isso 100% de acréscimo equivale a 50% de margem. Margem de 50% e acréscimo de 50% são coisas diferentes.</p>
    <p>Aqui as taxas (${nf(f,1)}%) são tiradas do preço de venda. Fórmulas: preço pela margem = custo ÷ (1 − taxas − margem); preço pelo acréscimo = custo × (1 + acréscimo) ÷ (1 − taxas). O lucro mostrado já desconta as taxas.</p>
    <p class="mut">Seu acréscimo de ${nf(n0(v.mk),1)}% corresponde a uma margem líquida de ${pk?pct(lk/pk):"—"}; sua margem de ${nf(n0(v.mg),1)}% corresponde a um acréscimo de ${C?nf(lm/C*100,1):"—"}%.</p></div>`;
}

async function backup(){
  const o={app:"jardim3d",versao:1,data:new Date().toISOString()};COLS.forEach(c=>o[c]=D[c]);
  saveFile("backup-jardim3d-"+today()+".json",JSON.stringify(o),"application/json");

function restore(file){
  const msg=$("#restoreMsg"),rd=new FileReader();
  rd.onload=async()=>{
    let o;try{o=JSON.parse(rd.result);if(o.app!=="jardim3d")throw 0}catch(_){msg.textContent="Esse arquivo não é um backup do Jardim 3D.";msg.className="sm bad";return}
    const n=COLS.reduce((s,c)=>s+(o[c]||[]).length,0);
    if(!await askConfirm(`Restaurar ${n} registros do backup de ${String(o.data||"").slice(0,10)}? Tudo o que existe hoje será substituído.`,"Restaurar"))return;
    msg.textContent="Restaurando...";msg.className="sm";
    try{for(const c of COLS){for(const x of [...D[c]])await del(c,x.id);for(const x of (o[c]||[]))await put(c,x)}msg.textContent="Backup restaurado.";msg.className="sm good";renderAll()}
    catch(e){msg.textContent="Falha ao restaurar: "+((e&&e.message)||"erro");msg.className="sm bad"}
  };rd.readAsText(file);
}

  "d-use-sug":e=>{if(e.dataset.v!==""){draft.itens[+e.dataset.i].preco=+e.dataset.v;renderDraft()}}
};
function showErrPage(e){openModal("Algo deu errado","<p>"+esc((e&&e.message)||String(e))+"</p>",[{label:"Fechar",fn:()=>{}}])}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act]){e.preventDefault();Promise.resolve(ACT[b.dataset.act](b)).catch(showErrPage)}
  if(e.target.id==="ov")closeModal();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden)closeModal()});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.actChange==="status"){const p=D.pedidos.find(x=>x.id===t.dataset.id);if(p){await put("pedidos",{...p,status:t.value});renderAll()}}
  if(t.dataset&&t.dataset.pf){P[t.dataset.pf]=t.value;if(t.dataset.pf==="preset"&&t.value==="custom"&&!P.from){P.from=today().slice(0,8)+"01";P.to=today()}renderAll()}
  if(t.id==="restoreIn"&&t.files[0]){restore(t.files[0]);t.value=""}
});
initStore();renderAll();
</script>

<script>
/* Rótulos das células para as tabelas em modo cartão (celular). */
(function(){
  function label(root){
    root.querySelectorAll("table").forEach(function(t){
      var hs=[].map.call(t.querySelectorAll("thead th"),function(h){return h.textContent.trim()});
      if(!hs.length)return;
      t.querySelectorAll("tbody tr, tfoot tr").forEach(function(tr){
        var i=0;[].forEach.call(tr.children,function(td){
          if(td.tagName!=="TD")return;
          if(td.colSpan>1){i+=td.colSpan;return}
          td.setAttribute("data-label",hs[i]||"");i++;
        });
      });
    });
  }
  function syncSt(){document.querySelectorAll('select.stsel,select[data-d="status"]').forEach(function(e){if(e.getAttribute("data-st")!==e.value)e.setAttribute("data-st",e.value)})}
  document.addEventListener("change",function(e){if(e.target&&e.target.matches&&e.target.matches('select.stsel,select[data-d="status"]'))syncSt()},true);
  var q=null;function sched(){if(q)return;q=requestAnimationFrame(function(){q=null;label(document);syncSt();if(window.__enhanceSearch)window.__enhanceSearch()})}
  new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
  sched();
})();
</script>

<script>
/* Seletor com busca: select[data-search] ganha campo de texto com lista filtrável. */
(function(){
  var norm=function(t){return String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()};
  var list=null,cur=null;
  function close(){if(list){list.remove();list=null}if(cur){var c=cur;cur=null;c.input.value=c.text()}}
  function enhance(sel){
    sel.setAttribute("data-enh","1");sel.style.display="none";
    var w=document.createElement("div");w.className="cb";
    var inp=document.createElement("input");inp.type="text";inp.autocomplete="off";inp.setAttribute("aria-label","Buscar");inp.placeholder="Digite para buscar...";
    w.appendChild(inp);sel.insertAdjacentElement("afterend",w);
    var text=function(){var o=sel.options[sel.selectedIndex];return o&&o.value!==""?o.textContent:""};
    inp.value=text();
    var items=[],active=0;
    function build(q){
      if(!list){list=document.createElement("div");list.className="cb-list";list.setAttribute("role","listbox");document.body.appendChild(list)}
      list.innerHTML="";items=[];var n=norm(q);
      [].forEach.call(sel.options,function(o){
        var pin=/^__/.test(o.value);
        if(!pin&&n&&(o.value===""||norm(o.textContent).indexOf(n)<0))return;
        if(!pin&&!n&&o.value==="")return;
        var d=document.createElement("div");d.textContent=o.textContent;d.setAttribute("role","option");
        if(pin)d.className="pin";if(o.value===sel.value&&o.value!=="")d.className+=" sel";
        d.addEventListener("mousedown",function(e){e.preventDefault();pick(o.value)});
        list.appendChild(d);items.push({d:d,v:o.value});
      });
      if(!items.length||(items.length===1&&/^__/.test(items[0].v)&&n)){var m=document.createElement("div");m.className="none";m.textContent="Nenhum resultado";list.insertBefore(m,list.firstChild)}
      active=items.findIndex(function(x){return !/^__/.test(x.v)});if(active<0)active=0;mark();place();
    }
    function mark(){items.forEach(function(x,i){x.d.classList.toggle("on",i===active)});if(items[active])items[active].d.scrollIntoView({block:"nearest"})}
    function place(){
      var r=inp.getBoundingClientRect(),h=Math.min(280,window.innerHeight*.4),below=window.innerHeight-r.bottom;
      list.style.left=r.left+"px";list.style.width=r.width+"px";list.style.maxHeight=h+"px";
      if(below<Math.min(h,180)&&r.top>below){list.style.top="auto";list.style.bottom=(window.innerHeight-r.top+4)+"px"}
      else{list.style.bottom="auto";list.style.top=(r.bottom+4)+"px"}
    }
    function pick(v){
      sel.value=v;cur=null;if(list){list.remove();list=null}
      inp.value=text();sel.dispatchEvent(new Event("change",{bubbles:true}));inp.blur();
    }
    inp.addEventListener("focus",function(){cur={input:inp,text:text};inp.select();build("")});
    inp.addEventListener("input",function(){build(inp.value)});
    inp.addEventListener("blur",function(){setTimeout(function(){if(document.activeElement!==inp)close()},120)});
    inp.addEventListener("keydown",function(e){
      if(!list)return;
      if(e.key==="ArrowDown"){e.preventDefault();active=Math.min(items.length-1,active+1);mark()}
      else if(e.key==="ArrowUp"){e.preventDefault();active=Math.max(0,active-1);mark()}
      else if(e.key==="Enter"){e.preventDefault();if(items[active])pick(items[active].v)}
      else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();inp.blur()}
    });
  }
  window.addEventListener("resize",function(){if(list)close()});
  document.addEventListener("scroll",function(e){if(list&&!list.contains(e.target))close()},true);
  window.__enhanceSearch=function(root){(root||document).querySelectorAll("select[data-search]:not([data-enh])").forEach(enhance)};
})();
</script>

<script>
/* Botao de tema claro/escuro (lembra a escolha neste aparelho). */
(function(){
  var root=document.documentElement,b=document.getElementById("btnTema"),m=document.querySelector('meta[name="theme-color"]');
  function isLight(){return root.getAttribute("data-theme")==="light"}
  function paint(){if(b)b.textContent=isLight()?"\u263E Escuro":"\u2600 Claro";if(m)m.setAttribute("content",isLight()?"#f2f5ff":"#0a1022")}
  if(b)b.addEventListener("click",function(){
    var l=!isLight();if(l)root.setAttribute("data-theme","light");else root.removeAttribute("data-theme");
    try{localStorage.setItem("jardim3d_theme",l?"light":"dark")}catch(e){}paint();
  });
  paint();
})();
</script>
